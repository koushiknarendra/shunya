name: IndexNow ping
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for the Vercel deploy to go live
        run: sleep 180
      - name: Submit changed pages to IndexNow
        run: node .github/scripts/indexnow.js --changed
