<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">RD Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="rd-amount">Monthly deposit (₹)</label>
        <input type="number" id="rd-amount" value="5000" min="0" step="500">
      </div>
      <div class="calc-field">
        <label for="rd-rate">Interest rate (% p.a.)</label>
        <input type="number" id="rd-rate" value="7" min="0" step="0.1">
        <div class="hint">Enter your bank's current RD rate — these vary by bank and tenure. Check your bank's website for the exact figure.</div>
      </div>
      <div class="calc-field">
        <label for="rd-months">Tenure (months)</label>
        <input type="number" id="rd-months" value="60" min="1" step="1">
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Maturity Value</div>
        <div class="rvalue" id="rd-fv">₹3,60,053</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">Total deposited</span><span class="rvalue" id="rd-invested">₹3,00,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Interest earned</span><span class="rvalue" id="rd-returns">₹60,053</span></div>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/rd-calculator" target="_blank" rel="noopener">RD Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const amountEl = document.getElementById('rd-amount');
  const rateEl = document.getElementById('rd-rate');
  const monthsEl = document.getElementById('rd-months');
  const fvEl = document.getElementById('rd-fv');
  const investedEl = document.getElementById('rd-invested');
  const returnsEl = document.getElementById('rd-returns');

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const R = parseFloat(amountEl.value) || 0;
    const annualRate = parseFloat(rateEl.value) || 0;
    const n = parseFloat(monthsEl.value) || 0;

    const r = annualRate / 12 / 100;

    let fv;
    if (r === 0) {
      fv = R * n;
    } else {
      fv = R * ((Math.pow(1 + r, n) - 1) / r) * (1 + r);
    }
    const invested = R * n;
    const returns = fv - invested;

    fvEl.textContent = fmt(fv);
    investedEl.textContent = fmt(invested);
    returnsEl.textContent = fmt(returns);
  }

  amountEl.addEventListener('input', calculate);
  rateEl.addEventListener('input', calculate);
  monthsEl.addEventListener('input', calculate);
  calculate();
})();
</script>
