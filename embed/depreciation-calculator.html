<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">Depreciation Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="dep-wdv">Opening WDV / asset cost (₹)</label>
        <input type="number" id="dep-wdv" value="500000" min="0" step="1">
      </div>
      <div class="calc-field">
        <label for="dep-block">Asset block</label>
        <select id="dep-block">
          <option value="10">Buildings — 10%</option>
          <option value="10">Furniture &amp; Fittings — 10%</option>
          <option value="15" selected>Plant &amp; Machinery — 15%</option>
          <option value="40">Computers &amp; Software — 40%</option>
          <option value="25">Intangible Assets — 25%</option>
        </select>
      </div>
      <div class="calc-field">
        <label>Used for 180 days or more this year?</label>
        <div class="radio-group">
          <label><input type="radio" name="dep-used" value="full" checked> Yes</label>
          <label><input type="radio" name="dep-used" value="half"> No</label>
        </div>
        <div class="hint">If an asset was used for less than 180 days in the year it was acquired, only half the normal depreciation rate applies.</div>
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Depreciation</div>
        <div class="rvalue" id="dep-depreciation">₹75,000</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">Opening WDV</span><span class="rvalue" id="dep-opening">₹5,00,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Depreciation rate applied</span><span class="rvalue" id="dep-rate-applied">15%</span></div>
      <div class="calc-result-row"><span class="rlabel">Closing WDV</span><span class="rvalue" id="dep-closing">₹4,25,000</span></div>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/depreciation-calculator" target="_blank" rel="noopener">Depreciation Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const wdvEl = document.getElementById('dep-wdv');
  const blockEl = document.getElementById('dep-block');
  const depreciationEl = document.getElementById('dep-depreciation');
  const openingEl = document.getElementById('dep-opening');
  const rateAppliedEl = document.getElementById('dep-rate-applied');
  const closingEl = document.getElementById('dep-closing');

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const wdv = parseFloat(wdvEl.value) || 0;
    const rate = parseFloat(blockEl.value) || 0;
    const usedFull = document.querySelector('input[name="dep-used"]:checked').value === 'full';
    const multiplier = usedFull ? 1 : 0.5;

    const depreciation = wdv * (rate / 100) * multiplier;
    const closing = wdv - depreciation;
    const rateApplied = usedFull ? rate : rate / 2;

    depreciationEl.textContent = fmt(depreciation);
    openingEl.textContent = fmt(wdv);
    rateAppliedEl.textContent = rateApplied + '%';
    closingEl.textContent = fmt(closing);
  }

  wdvEl.addEventListener('input', calculate);
  blockEl.addEventListener('change', calculate);
  document.querySelectorAll('input[name="dep-used"]').forEach(el => el.addEventListener('change', calculate));
  calculate();
})();
</script>
<script>(function(){function s(){try{parent.postMessage({shunyaEmbed:"depreciation-calculator",height:Math.ceil(document.querySelector(".embed-wrap").getBoundingClientRect().bottom+12)},'*')}catch(e){}}addEventListener('load',s);addEventListener('input',function(){setTimeout(s,50)});addEventListener('change',function(){setTimeout(s,50)})})()</script>
