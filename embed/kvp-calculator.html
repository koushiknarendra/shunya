<div class="embed-wrap">
  <h1 class="embed-title">KVP Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="kvp-investment">Investment amount (₹)</label>
        <input type="number" id="kvp-investment" value="100000" min="1000" step="100">
        <div class="hint">Minimum ₹1,000, in multiples of ₹100, no maximum limit.</div>
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Maturity Value</div>
        <div class="rvalue" id="kvp-maturity">₹2,00,000</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">Investment amount</span><span class="rvalue" id="kvp-investment-out">₹1,00,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Interest earned</span><span class="rvalue" id="kvp-interest">₹1,00,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Doubling period</span><span class="rvalue">115 months (9y 7m)</span></div>
      <div class="calc-result-row"><span class="rlabel">Current KVP rate</span><span class="rvalue">7.5% p.a.</span></div>

  <p class="embed-credit">Free <a href="https://shunya.so/tools/kvp-calculator" target="_blank" rel="noopener">KVP Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>

<script>
(function(){
  const investmentEl = document.getElementById('kvp-investment');
  const maturityEl = document.getElementById('kvp-maturity');
  const investmentOutEl = document.getElementById('kvp-investment-out');
  const interestEl = document.getElementById('kvp-interest');

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const investment = parseFloat(investmentEl.value) || 0;
    const maturity = investment * 2;
    const interest = maturity - investment;

    maturityEl.textContent = fmt(maturity);
    investmentOutEl.textContent = fmt(investment);
    interestEl.textContent = fmt(interest);
  }

  investmentEl.addEventListener('input', calculate);
  calculate();
})();
</script>
