<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">Stock Split Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="split-shares">Current shares held</label>
        <input type="number" id="split-shares" value="100" min="0" step="1">
      </div>
      <div class="calc-field">
        <label for="split-price">Current price per share (₹)</label>
        <input type="number" id="split-price" value="500" min="0" step="0.01">
      </div>
      <div class="calc-field">
        <label>Split ratio</label>
        <div class="ratio-inputs" style="display:flex; align-items:center; gap:0.5rem;">
          <input type="number" id="split-from" value="1" min="1" step="1" style="width:5rem;">
          <span>:</span>
          <input type="number" id="split-to" value="5" min="1" step="1" style="width:5rem;">
        </div>
        <div class="hint">A 1:5 split means every 1 share becomes 5. Enter your company's announced split ratio.</div>
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">New Shares Held</div>
        <div class="rvalue" id="split-new-shares">500</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">New price per share</span><span class="rvalue" id="split-new-price">₹100.00</span></div>
      <div class="calc-result-row"><span class="rlabel">Total value before split</span><span class="rvalue" id="split-value-before">₹50,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Total value after split</span><span class="rvalue" id="split-value-after">₹50,000</span></div>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/stock-split-calculator" target="_blank" rel="noopener">Stock Split Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const sharesEl = document.getElementById('split-shares');
  const priceEl = document.getElementById('split-price');
  const fromEl = document.getElementById('split-from');
  const toEl = document.getElementById('split-to');
  const newSharesEl = document.getElementById('split-new-shares');
  const newPriceEl = document.getElementById('split-new-price');
  const valueBeforeEl = document.getElementById('split-value-before');
  const valueAfterEl = document.getElementById('split-value-after');

  function fmtNum(n) {
    return Math.round(n).toLocaleString('en-IN');
  }

  function fmtMoney(n) {
    return '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtRupee(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const shares = parseFloat(sharesEl.value) || 0;
    const price = parseFloat(priceEl.value) || 0;
    const from = parseFloat(fromEl.value) || 1;
    const to = parseFloat(toEl.value) || 1;

    const newShares = shares * (to / from);
    const newPrice = price * (from / to);
    const valueBefore = shares * price;
    const valueAfter = newShares * newPrice;

    newSharesEl.textContent = fmtNum(newShares);
    newPriceEl.textContent = fmtMoney(newPrice);
    valueBeforeEl.textContent = fmtRupee(valueBefore);
    valueAfterEl.textContent = fmtRupee(valueAfter);
  }

  sharesEl.addEventListener('input', calculate);
  priceEl.addEventListener('input', calculate);
  fromEl.addEventListener('input', calculate);
  toEl.addEventListener('input', calculate);
  calculate();
})();
</script>
