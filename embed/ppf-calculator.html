<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">PPF Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="ppf-contribution">Annual contribution (₹)</label>
        <input type="number" id="ppf-contribution" value="150000" min="500" max="150000" step="500">
        <div class="hint">Maximum ₹1.5 lakh per year.</div>
      </div>
      <div class="calc-field">
        <label for="ppf-years">Investment period (years)</label>
        <input type="number" id="ppf-years" value="15" min="1" max="50" step="1">
        <div class="hint">15 years is the standard PPF tenure, extendable in blocks of 5 years.</div>
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Maturity Value</div>
        <div class="rvalue" id="ppf-maturity">₹40,68,209</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">Total contribution</span><span class="rvalue" id="ppf-invested">₹22,50,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Total interest earned</span><span class="rvalue" id="ppf-interest">₹18,18,209</span></div>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/ppf-calculator" target="_blank" rel="noopener">PPF Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const RATE = 0.071;
  const contributionEl = document.getElementById('ppf-contribution');
  const yearsEl = document.getElementById('ppf-years');
  const maturityEl = document.getElementById('ppf-maturity');
  const investedEl = document.getElementById('ppf-invested');
  const interestEl = document.getElementById('ppf-interest');

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const contribution = parseFloat(contributionEl.value) || 0;
    const years = parseFloat(yearsEl.value) || 0;

    const maturity = contribution * (((Math.pow(1 + RATE, years) - 1) / RATE) * (1 + RATE));
    const invested = contribution * years;
    const interest = maturity - invested;

    maturityEl.textContent = fmt(maturity);
    investedEl.textContent = fmt(invested);
    interestEl.textContent = fmt(interest);
  }

  contributionEl.addEventListener('input', calculate);
  yearsEl.addEventListener('input', calculate);
  calculate();
})();
</script>
