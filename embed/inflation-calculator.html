<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">Inflation Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="inf-amount">Current amount (₹)</label>
        <input type="number" id="inf-amount" value="100000" min="0" step="1000">
      </div>
      <div class="calc-field">
        <label for="inf-rate">Expected annual inflation rate (%)</label>
        <input type="number" id="inf-rate" value="6" min="0" step="0.1">
        <div class="hint">India's RBI targets 4% CPI inflation with a 2% tolerance band either way; 6% is a commonly used planning assumption, not a forecast.</div>
      </div>
      <div class="calc-field">
        <label for="inf-years">Number of years</label>
        <input type="number" id="inf-years" value="10" min="1" step="1">
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Future Cost</div>
        <div class="rvalue" id="inf-future">₹1,79,085</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">Purchasing power of today's amount, then</span><span class="rvalue" id="inf-real">₹55,839</span></div>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/inflation-calculator" target="_blank" rel="noopener">Inflation Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const amountEl = document.getElementById('inf-amount');
  const rateEl = document.getElementById('inf-rate');
  const yearsEl = document.getElementById('inf-years');
  const futureEl = document.getElementById('inf-future');
  const realEl = document.getElementById('inf-real');

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const amount = parseFloat(amountEl.value) || 0;
    const rate = parseFloat(rateEl.value) || 0;
    const years = parseFloat(yearsEl.value) || 0;

    const factor = Math.pow(1 + rate / 100, years);
    const future = amount * factor;
    const real = factor === 0 ? 0 : amount / factor;

    futureEl.textContent = fmt(future);
    realEl.textContent = fmt(real);
  }

  amountEl.addEventListener('input', calculate);
  rateEl.addEventListener('input', calculate);
  yearsEl.addEventListener('input', calculate);
  calculate();
})();
</script>
