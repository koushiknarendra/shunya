<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">Compound Interest Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="ci-principal">Principal (₹)</label>
        <input type="number" id="ci-principal" value="100000" min="0" step="1">
      </div>
      <div class="calc-field">
        <label for="ci-rate">Annual interest rate (%)</label>
        <input type="number" id="ci-rate" value="8" min="0" step="0.1">
        <div class="hint">Enter the rate for your specific deposit or investment — this varies by bank and product.</div>
      </div>
      <div class="calc-field">
        <label for="ci-years">Time period (years)</label>
        <input type="number" id="ci-years" value="5" min="0" step="1">
      </div>
      <div class="calc-field">
        <label for="ci-freq">Compounding frequency</label>
        <select id="ci-freq">
          <option value="1" selected>Annually</option>
          <option value="2">Semi-annually</option>
          <option value="4">Quarterly</option>
          <option value="12">Monthly</option>
        </select>
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Maturity Amount</div>
        <div class="rvalue" id="ci-total">₹1,46,933</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">Principal</span><span class="rvalue" id="ci-principal-out">₹1,00,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Interest earned</span><span class="rvalue" id="ci-interest">₹46,933</span></div>
      <div class="calc-result-row"><span class="rlabel">Compounding</span><span class="rvalue" id="ci-freq-out">Annually</span></div>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/compound-interest-calculator" target="_blank" rel="noopener">Compound Interest Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const principalEl = document.getElementById('ci-principal');
  const rateEl = document.getElementById('ci-rate');
  const yearsEl = document.getElementById('ci-years');
  const freqEl = document.getElementById('ci-freq');
  const totalEl = document.getElementById('ci-total');
  const principalOutEl = document.getElementById('ci-principal-out');
  const interestEl = document.getElementById('ci-interest');
  const freqOutEl = document.getElementById('ci-freq-out');

  const freqLabels = { '1': 'Annually', '2': 'Semi-annually', '4': 'Quarterly', '12': 'Monthly' };

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const principal = parseFloat(principalEl.value) || 0;
    const rate = parseFloat(rateEl.value) || 0;
    const years = parseFloat(yearsEl.value) || 0;
    const freq = parseFloat(freqEl.value) || 1;

    const amount = principal * Math.pow(1 + (rate / 100) / freq, freq * years);
    const interest = amount - principal;

    totalEl.textContent = fmt(amount);
    principalOutEl.textContent = fmt(principal);
    interestEl.textContent = fmt(interest);
    freqOutEl.textContent = freqLabels[String(freq)] || 'Annually';
  }

  principalEl.addEventListener('input', calculate);
  rateEl.addEventListener('input', calculate);
  yearsEl.addEventListener('input', calculate);
  freqEl.addEventListener('change', calculate);
  calculate();
})();
</script>
