<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">GST Late Fee Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="fee-days">Number of days late</label>
        <input type="number" id="fee-days" value="30" min="0" step="1">
      </div>
      <div class="calc-field">
        <label>Return type</label>
        <div class="radio-group">
          <label><input type="radio" name="fee-return-type" value="normal" checked> Normal return with tax liability</label>
          <label><input type="radio" name="fee-return-type" value="nil"> Nil return</label>
        </div>
        <div class="hint">Normal returns are charged ₹50/day (capped at ₹10,000). Nil returns are charged ₹20/day (capped at ₹500) — nil doesn't mean fee-free.</div>
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Total Late Fee</div>
        <div class="rvalue" id="fee-total">₹1,500</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">CGST</span><span class="rvalue" id="fee-cgst">₹750</span></div>
      <div class="calc-result-row"><span class="rlabel">SGST</span><span class="rvalue" id="fee-sgst">₹750</span></div>
      <p class="hint" id="fee-cap-note" style="display:none;"></p>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/gst-late-fee-calculator" target="_blank" rel="noopener">GST Late Fee Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const daysEl = document.getElementById('fee-days');
  const totalEl = document.getElementById('fee-total');
  const cgstEl = document.getElementById('fee-cgst');
  const sgstEl = document.getElementById('fee-sgst');
  const capNote = document.getElementById('fee-cap-note');

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const days = Math.max(0, parseFloat(daysEl.value) || 0);
    const returnType = document.querySelector('input[name="fee-return-type"]:checked').value;

    let perDay, cap;
    if (returnType === 'normal') {
      perDay = 50;
      cap = 10000;
    } else {
      perDay = 20;
      cap = 500;
    }

    const rawFee = days * perDay;
    const fee = Math.min(rawFee, cap);
    const half = fee / 2;

    totalEl.textContent = fmt(fee);
    cgstEl.textContent = fmt(half);
    sgstEl.textContent = fmt(half);

    if (rawFee > cap) {
      capNote.style.display = '';
      capNote.textContent = 'Capped at the maximum late fee of ' + fmt(cap) + ' for this return type.';
    } else {
      capNote.style.display = 'none';
    }
  }

  daysEl.addEventListener('input', calculate);
  document.querySelectorAll('input[name="fee-return-type"]').forEach(el => el.addEventListener('change', calculate));
  calculate();
})();
</script>
