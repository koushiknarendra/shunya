<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">Margin Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="margin-trade-value">Trade value (₹)</label>
        <input type="number" id="margin-trade-value" value="100000" min="0" step="1">
      </div>
      <div class="calc-field">
        <label for="margin-leverage">Leverage (x)</label>
        <input type="number" id="margin-leverage" value="5" min="1" step="0.1">
        <div class="hint">Enter your broker's offered leverage for this stock — leverage limits vary by broker, by stock, and by exchange/SEBI rules for the segment.</div>
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Margin Required</div>
        <div class="rvalue" id="margin-required">₹20,000</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">Trade value</span><span class="rvalue" id="margin-trade-out">₹1,00,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Borrowed amount</span><span class="rvalue" id="margin-borrowed">₹80,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Leverage used</span><span class="rvalue" id="margin-leverage-out">5.0x</span></div>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/margin-calculator" target="_blank" rel="noopener">Margin Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const tradeEl = document.getElementById('margin-trade-value');
  const leverageEl = document.getElementById('margin-leverage');
  const requiredEl = document.getElementById('margin-required');
  const tradeOutEl = document.getElementById('margin-trade-out');
  const borrowedEl = document.getElementById('margin-borrowed');
  const leverageOutEl = document.getElementById('margin-leverage-out');

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const trade = parseFloat(tradeEl.value) || 0;
    let leverage = parseFloat(leverageEl.value) || 0;
    if (leverage < 1) leverage = 1;

    const marginRequired = trade / leverage;
    const borrowed = trade - marginRequired;

    requiredEl.textContent = fmt(marginRequired);
    tradeOutEl.textContent = fmt(trade);
    borrowedEl.textContent = fmt(borrowed);
    leverageOutEl.textContent = leverage.toFixed(1) + 'x';
  }

  tradeEl.addEventListener('input', calculate);
  leverageEl.addEventListener('input', calculate);
  calculate();
})();
</script>
<script>(function(){function s(){try{parent.postMessage({shunyaEmbed:"margin-calculator",height:Math.ceil(document.querySelector(".embed-wrap").getBoundingClientRect().bottom+12)},'*')}catch(e){}}addEventListener('load',s);addEventListener('input',function(){setTimeout(s,50)});addEventListener('change',function(){setTimeout(s,50)})})()</script>
