<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">Stock Average Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="sa-qty1">Buy 1 — Quantity</label>
        <input type="number" id="sa-qty1" value="100" min="0" step="1">
      </div>
      <div class="calc-field">
        <label for="sa-price1">Buy 1 — Price per share (₹)</label>
        <input type="number" id="sa-price1" value="50" min="0" step="0.01">
      </div>
      <div class="calc-field">
        <label for="sa-qty2">Buy 2 — Quantity</label>
        <input type="number" id="sa-qty2" value="100" min="0" step="1">
      </div>
      <div class="calc-field">
        <label for="sa-price2">Buy 2 — Price per share (₹)</label>
        <input type="number" id="sa-price2" value="70" min="0" step="0.01">
      </div>
      <div class="calc-field">
        <label for="sa-qty3">Buy 3 — Quantity <span style="font-weight:400;">(optional)</span></label>
        <input type="number" id="sa-qty3" value="0" min="0" step="1">
      </div>
      <div class="calc-field">
        <label for="sa-price3">Buy 3 — Price per share (₹)</label>
        <input type="number" id="sa-price3" value="0" min="0" step="0.01">
        <div class="hint">Leave Buy 3 at 0 quantity if you only have two purchase lots.</div>
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Average Price</div>
        <div class="rvalue" id="sa-avg">₹60.00</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">Total quantity</span><span class="rvalue" id="sa-qty">200</span></div>
      <div class="calc-result-row"><span class="rlabel">Total invested</span><span class="rvalue" id="sa-invested">₹12,000</span></div>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/stock-average-calculator" target="_blank" rel="noopener">Stock Average Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const qty1El = document.getElementById('sa-qty1');
  const price1El = document.getElementById('sa-price1');
  const qty2El = document.getElementById('sa-qty2');
  const price2El = document.getElementById('sa-price2');
  const qty3El = document.getElementById('sa-qty3');
  const price3El = document.getElementById('sa-price3');
  const avgEl = document.getElementById('sa-avg');
  const qtyEl = document.getElementById('sa-qty');
  const investedEl = document.getElementById('sa-invested');

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const qty1 = parseFloat(qty1El.value) || 0;
    const price1 = parseFloat(price1El.value) || 0;
    const qty2 = parseFloat(qty2El.value) || 0;
    const price2 = parseFloat(price2El.value) || 0;
    const qty3 = parseFloat(qty3El.value) || 0;
    const price3 = parseFloat(price3El.value) || 0;

    const totalQty = qty1 + qty2 + qty3;
    const totalInvested = (qty1 * price1) + (qty2 * price2) + (qty3 * price3);
    const avgPrice = totalQty > 0 ? totalInvested / totalQty : 0;

    avgEl.textContent = '₹' + avgPrice.toFixed(2);
    qtyEl.textContent = totalQty.toLocaleString('en-IN');
    investedEl.textContent = fmt(totalInvested);
  }

  [qty1El, price1El, qty2El, price2El, qty3El, price3El].forEach(el => el.addEventListener('input', calculate));
  calculate();
})();
</script>
<script>(function(){function s(){try{parent.postMessage({shunyaEmbed:"stock-average-calculator",height:Math.ceil(document.querySelector(".embed-wrap").getBoundingClientRect().bottom+12)},'*')}catch(e){}}addEventListener('load',s);addEventListener('input',function(){setTimeout(s,50)});addEventListener('change',function(){setTimeout(s,50)})})()</script>
