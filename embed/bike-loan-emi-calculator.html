<div class="embed-wrap">
  <h1 class="embed-title">Bike Loan EMI Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="bike-amount">Loan amount (₹)</label>
        <input type="number" id="bike-amount" value="100000" min="0" step="1000">
      </div>
      <div class="calc-field">
        <label for="bike-rate">Annual interest rate (%)</label>
        <input type="number" id="bike-rate" value="11" min="0" step="0.1">
        <div class="hint">Enter your lender's current bike loan rate — rates vary by lender and your credit profile.</div>
      </div>
      <div class="calc-field">
        <label for="bike-tenure">Loan tenure (years)</label>
        <input type="number" id="bike-tenure" value="3" min="1" step="1">
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Monthly EMI</div>
        <div class="rvalue" id="bike-emi">₹3,274</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">Principal amount</span><span class="rvalue" id="bike-principal">₹1,00,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Total interest payable</span><span class="rvalue" id="bike-interest">₹17,859</span></div>

</div>
<script>
(function(){
  const amountEl = document.getElementById('bike-amount');
  const rateEl = document.getElementById('bike-rate');
  const tenureEl = document.getElementById('bike-tenure');
  const emiEl = document.getElementById('bike-emi');
  const principalEl = document.getElementById('bike-principal');
  const interestEl = document.getElementById('bike-interest');
  const totalEl = document.getElementById('bike-total');

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const P = parseFloat(amountEl.value) || 0;
    const annualRate = parseFloat(rateEl.value) || 0;
    const years = parseFloat(tenureEl.value) || 0;

    const r = annualRate / 12 / 100;
    const n = years * 12;

    let emi = 0;
    if (P > 0 && n > 0) {
      if (r === 0) {
        emi = P / n;
      } else {
        const pow = Math.pow(1 + r, n);
        emi = P * r * pow / (pow - 1);
      }
    }

    const totalPayment = emi * n;
    const totalInterest = totalPayment - P;

    emiEl.textContent = fmt(emi);
    principalEl.textContent = fmt(P);
    interestEl.textContent = fmt(totalInterest);
    totalEl.textContent = fmt(totalPayment);
  }

  amountEl.addEventListener('input', calculate);
  rateEl.addEventListener('input', calculate);
  tenureEl.addEventListener('input', calculate);
  calculate();
})();
</script>
