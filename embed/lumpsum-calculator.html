<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">Lumpsum Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="ls-principal">One-time investment (₹)</label>
        <input type="number" id="ls-principal" value="100000" min="0" step="1000">
      </div>
      <div class="calc-field">
        <label for="ls-rate">Expected annual return (%)</label>
        <input type="number" id="ls-rate" value="12" min="0" step="0.1">
        <div class="hint">This is an assumption you enter — market-linked returns aren't guaranteed. Use a rate that reflects a reasonable expectation for your investment type.</div>
      </div>
      <div class="calc-field">
        <label for="ls-years">Investment period (years)</label>
        <input type="number" id="ls-years" value="10" min="1" step="1">
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Future Value</div>
        <div class="rvalue" id="ls-fv">₹3,10,585</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">Invested amount</span><span class="rvalue" id="ls-invested">₹1,00,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Estimated returns</span><span class="rvalue" id="ls-returns">₹2,10,585</span></div>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/lumpsum-calculator" target="_blank" rel="noopener">Lumpsum Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const principalEl = document.getElementById('ls-principal');
  const rateEl = document.getElementById('ls-rate');
  const yearsEl = document.getElementById('ls-years');
  const fvEl = document.getElementById('ls-fv');
  const investedEl = document.getElementById('ls-invested');
  const returnsEl = document.getElementById('ls-returns');

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const principal = parseFloat(principalEl.value) || 0;
    const rate = parseFloat(rateEl.value) || 0;
    const years = parseFloat(yearsEl.value) || 0;

    const fv = principal * Math.pow(1 + rate / 100, years);
    const returns = fv - principal;

    fvEl.textContent = fmt(fv);
    investedEl.textContent = fmt(principal);
    returnsEl.textContent = fmt(returns);
  }

  principalEl.addEventListener('input', calculate);
  rateEl.addEventListener('input', calculate);
  yearsEl.addEventListener('input', calculate);
  calculate();
})();
</script>
