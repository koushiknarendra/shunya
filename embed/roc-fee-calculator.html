<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">ROC Fee Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="roc-capital">Authorized share capital (₹)</label>
        <input type="number" id="roc-capital" value="1000000" min="0" step="1">
      </div>
      <div class="calc-field">
        <label for="roc-days">Days late (0 = filed on time)</label>
        <input type="number" id="roc-days" value="0" min="0" step="1">
        <div class="hint">Number of days after the due date that you filed (or expect to file). Leave at 0 if you're filing on time.</div>
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Combined Total (AOC-4 + MGT-7)</div>
        <div class="rvalue" id="roc-combined">₹800</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">AOC-4 fee</span><span class="rvalue" id="roc-aoc4">₹400</span></div>
      <div class="calc-result-row"><span class="rlabel">MGT-7 fee</span><span class="rvalue" id="roc-mgt7">₹400</span></div>
      <div class="calc-result-row"><span class="rlabel">Base fee (per form)</span><span class="rvalue" id="roc-base">₹400</span></div>
      <div class="calc-result-row" id="roc-late-row" style="display:none;"><span class="rlabel">Late fee (per form)</span><span class="rvalue" id="roc-late">₹0</span></div>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/roc-fee-calculator" target="_blank" rel="noopener">ROC Fee Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const capitalEl = document.getElementById('roc-capital');
  const daysEl = document.getElementById('roc-days');
  const combinedEl = document.getElementById('roc-combined');
  const aoc4El = document.getElementById('roc-aoc4');
  const mgt7El = document.getElementById('roc-mgt7');
  const baseEl = document.getElementById('roc-base');
  const lateEl = document.getElementById('roc-late');
  const lateRow = document.getElementById('roc-late-row');

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function baseFee(capital) {
    if (capital <= 100000) return 200;
    if (capital <= 500000) return 300;
    if (capital <= 2500000) return 400;
    if (capital <= 10000000) return 500;
    return 600;
  }

  function calculate() {
    const capital = parseFloat(capitalEl.value) || 0;
    const daysLate = Math.max(0, parseFloat(daysEl.value) || 0);

    const base = baseFee(capital);
    const late = daysLate > 0 ? daysLate * 100 : 0;
    const perForm = base + late;
    const combined = perForm * 2;

    combinedEl.textContent = fmt(combined);
    aoc4El.textContent = fmt(perForm);
    mgt7El.textContent = fmt(perForm);
    baseEl.textContent = fmt(base);
    lateEl.textContent = fmt(late);

    if (daysLate > 0) {
      lateRow.style.display = '';
    } else {
      lateRow.style.display = 'none';
    }
  }

  capitalEl.addEventListener('input', calculate);
  daysEl.addEventListener('input', calculate);
  calculate();
})();
</script>
