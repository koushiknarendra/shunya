<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">Post Office MIS Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="mis-deposit">Deposit amount (₹)</label>
        <input type="number" id="mis-deposit" value="900000" min="0" step="1000">
        <div class="hint">Maximum ₹9 lakh for a single account, ₹15 lakh for a joint account.</div>
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Monthly Income</div>
        <div class="rvalue" id="mis-monthly">₹5,550</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">Deposit amount</span><span class="rvalue" id="mis-deposit-display">₹9,00,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Interest rate</span><span class="rvalue">7.4% p.a.</span></div>
      <div class="calc-result-row"><span class="rlabel">Total income over 5-year tenure</span><span class="rvalue" id="mis-total">₹3,33,000</span></div>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/post-office-mis-calculator" target="_blank" rel="noopener">Post Office MIS Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const depositEl = document.getElementById('mis-deposit');
  const monthlyEl = document.getElementById('mis-monthly');
  const depositDisplayEl = document.getElementById('mis-deposit-display');
  const totalEl = document.getElementById('mis-total');

  const RATE = 7.4;

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function calculate() {
    const deposit = parseFloat(depositEl.value) || 0;
    const monthlyIncome = deposit * (RATE / 100) / 12;
    const totalOver5Years = monthlyIncome * 60;

    monthlyEl.textContent = fmt(monthlyIncome);
    depositDisplayEl.textContent = fmt(deposit);
    totalEl.textContent = fmt(totalOver5Years);
  }

  depositEl.addEventListener('input', calculate);
  calculate();
})();
</script>
<script>(function(){function s(){try{parent.postMessage({shunyaEmbed:"post-office-mis-calculator",height:Math.ceil(document.querySelector(".embed-wrap").getBoundingClientRect().bottom+12)},'*')}catch(e){}}addEventListener('load',s);addEventListener('input',function(){setTimeout(s,50)});addEventListener('change',function(){setTimeout(s,50)})})()</script>
