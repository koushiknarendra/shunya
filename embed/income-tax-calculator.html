<body class="__variable_a4bae9 __variable_f367f3 __variable_73ee6c">
<div class="embed-wrap">
  <h1 class="embed-title">Income Tax Calculator</h1>
  <div class="calc-card">
    <div class="calc-inputs">
      <div class="calc-field">
        <label for="itc-income">Annual taxable income (₹)</label>
        <input type="number" id="itc-income" value="1500000" min="0" step="1">
      </div>
      <div class="calc-field">
        <label>Tax regime</label>
        <div class="radio-group">
          <label><input type="radio" name="itc-regime" value="new" checked> New Regime</label>
          <label><input type="radio" name="itc-regime" value="old"> Old Regime</label>
        </div>
      </div>
    </div>
    <div class="calc-results">
      <div class="calc-result-hero">
        <div class="rlabel">Total Tax Payable</div>
        <div class="rvalue" id="itc-total">₹1,09,200</div>
      </div>
      <div class="calc-result-row"><span class="rlabel">Tax before cess</span><span class="rvalue" id="itc-slab-tax">₹1,05,000</span></div>
      <div class="calc-result-row"><span class="rlabel">Health &amp; Education cess (4%)</span><span class="rvalue" id="itc-cess">₹4,200</span></div>
      <div class="calc-result-row" id="itc-rebate-row" style="display:none;"><span class="rlabel">Section 87A rebate</span><span class="rvalue" id="itc-rebate-note">Applied — tax reduced to ₹0</span></div>
    </div>
  </div>
  <p class="embed-credit">Free <a href="https://shunya.so/tools/income-tax-calculator" target="_blank" rel="noopener">Income Tax Calculator</a> by <a href="https://shunya.so" target="_blank" rel="noopener">Shunya</a> · <a href="https://shunya.so/tools" target="_blank" rel="noopener">More free tools</a></p>
</div>
<script>
(function(){
  const incomeEl = document.getElementById('itc-income');
  const totalEl = document.getElementById('itc-total');
  const slabTaxEl = document.getElementById('itc-slab-tax');
  const cessEl = document.getElementById('itc-cess');
  const rebateRow = document.getElementById('itc-rebate-row');

  function fmt(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  function newRegimeSlabTax(income) {
    if (income <= 1200000) return 0;
    const slabs = [
      [400000, 800000, 0.05],
      [800000, 1200000, 0.10],
      [1200000, 1600000, 0.15],
      [1600000, 2000000, 0.20],
      [2000000, 2400000, 0.25],
      [2400000, Infinity, 0.30]
    ];
    let tax = 0;
    for (const [lo, hi, rate] of slabs) {
      if (income > lo) tax += (Math.min(income, hi) - lo) * rate;
    }
    return tax;
  }

  function oldRegimeSlabTax(income) {
    if (income <= 500000) return 0;
    const slabs = [
      [250000, 500000, 0.05],
      [500000, 1000000, 0.20],
      [1000000, Infinity, 0.30]
    ];
    let tax = 0;
    for (const [lo, hi, rate] of slabs) {
      if (income > lo) tax += (Math.min(income, hi) - lo) * rate;
    }
    return tax;
  }

  function calculate() {
    const income = parseFloat(incomeEl.value) || 0;
    const regime = document.querySelector('input[name="itc-regime"]:checked').value;

    const slabTax = regime === 'new' ? newRegimeSlabTax(income) : oldRegimeSlabTax(income);
    const cess = slabTax * 0.04;
    const total = slabTax + cess;

    totalEl.textContent = fmt(total);
    slabTaxEl.textContent = fmt(slabTax);
    cessEl.textContent = fmt(cess);

    const rebateThreshold = regime === 'new' ? 1200000 : 500000;
    if (income > 0 && income <= rebateThreshold) {
      rebateRow.style.display = '';
    } else {
      rebateRow.style.display = 'none';
    }
  }

  incomeEl.addEventListener('input', calculate);
  document.querySelectorAll('input[name="itc-regime"]').forEach(el => el.addEventListener('change', calculate));
  calculate();
})();
</script>
